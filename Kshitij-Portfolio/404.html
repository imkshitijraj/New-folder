<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Kshitij Raj</title>
  <link rel="stylesheet" href="./assets/css/style.css">
  <style>
    .not-found-wrap {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 6rem 0;
    }
    .not-found-badge {
      margin-bottom: 1.5rem;
    }
    .not-found-num {
      font-size: clamp(5rem, 12vw, 8rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
      color: var(--accent);
      margin-bottom: 1rem;
    }
    .not-found-title {
      font-size: clamp(1.8rem, 3.5vw, 2.5rem);
      font-weight: 700;
      margin-bottom: 1rem;
    }
    .not-found-desc {
      font-size: 1.1rem;
      color: var(--text-secondary);
      max-width: 480px;
      line-height: 1.6;
      margin-bottom: 2.5rem;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand-name">KSHITIJ RAJ</a>
      <a href="index.html" class="btn btn-secondary" style="padding: 0.4rem 1rem; font-size: 0.85rem;">
        Return to Home
      </a>
    </div>
  </header>

  <main class="container not-found-wrap">
    <div class="badge badge-accent not-found-badge">Error 404</div>
    <div class="not-found-num">404</div>
    <h1 class="not-found-title">Page not found</h1>
    <p class="not-found-desc">
      The page you're looking for doesn't exist or has moved. Let's get you back to the main site.
    </p>
    <a href="index.html" class="btn btn-primary">
      Back to Home <i class="ri-arrow-right-line" aria-hidden="true"></i>
    </a>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span class="footer-copy">Kshitij Raj © 2026 · Kolkata, India</span>
      <a href="index.html" class="footer-link">Home</a>
    </div>
  </footer>

</body>
</html>
